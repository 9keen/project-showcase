<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autokan AI Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a shipped SaaS CRM — calm, exact, confident; the product is the picture.
   IDEA: a kanban board on a workshop wall — cards moving left to right toward "Won".
   PICTURE: the live board and dashboard themselves; brand glyph = three kanban columns.
   COLOUR and TYPE: deep teal sidebar field, white work surface, one orange pointer for overdue/AI; Geist throughout.
   LAYOUT: fixed sidebar + top bar, content up to 1240px; sidebar becomes an off-canvas drawer under 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f6,#0e1213);--panel:light-dark(#ffffff,#171c1e);--ink:light-dark(#14161a,#e7ebec);
--mute:light-dark(#5b6470,#98a3a8);--line:light-dark(#e2e6e8,#283033);--soft:light-dark(#eef2f3,#1e2527);
--brand:light-dark(#0b5d63,#3fb3aa);--side:light-dark(#0a3f43,#0a1c1e);--sideink:#d9ecea;
--acc:light-dark(#e04600,#ff7a3d);--ok:light-dark(#1d7a4c,#5fcf93);--bad:light-dark(#c2331f,#ff7b6b);--warn:light-dark(#a95f06,#f0a54a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;z-index:30}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px}
.logo b{font-size:19px;letter-spacing:-.01em;color:#fff;display:block;line-height:1.1}
.logo small{font-size:12px;opacity:.7}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--sideink);text-decoration:none;padding:10px 12px;border-radius:8px;min-height:42px;opacity:.82}
nav a:hover{background:#ffffff14;opacity:1}
nav a.on{background:#ffffff1f;opacity:1;color:#fff;font-weight:600}
nav a i{font-style:normal;font-size:12px;background:var(--acc);color:#fff;border-radius:99px;padding:1px 8px}
.sidefoot{margin-top:auto;font-size:12px;opacity:.72;padding:0 8px}
.sidefoot a{color:#fff}
main{display:flex;flex-direction:column;min-height:100vh}
.ribbon{background:light-dark(#fff1e9,#2a1a10);color:light-dark(#8a3a0c,#ffb184);font-size:13px;padding:7px max(3vw,16px);border-bottom:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:20px;margin:0;font-weight:600;flex:1;letter-spacing:-.01em}
.burger{display:none;border:1px solid var(--line);background:none;border-radius:8px;width:44px;height:44px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;font-size:16px}
.who select{font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;min-height:42px;font-weight:500}
.btn.pri{background:var(--brand);border-color:var(--brand);color:light-dark(#fff,#062022)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.wrap{padding:22px max(3vw,16px) 48px;max-width:1300px;width:100%}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{font-size:clamp(26px,3.4vw,36px);line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:600}
.hello p{margin:6px 0 0;color:var(--mute);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:clamp(22px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;margin-top:2px}
.kpi small{color:var(--mute);font-size:13px}
.kpi.hot b{color:var(--acc)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.card h3{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mute);font-size:13px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:22px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .t div{height:100%;border-radius:6px;transition:width .5s}
.bar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .n{color:var(--mute);font-size:12px}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .s{font-size:13px;color:var(--mute)}
.due{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 8px;border-radius:99px;background:var(--soft)}
.due.late{background:light-dark(#ffe7dc,#3a1d10);color:var(--acc)}
.due.today{background:light-dark(#e1f1ef,#12302d);color:var(--brand)}
.wa{background:light-dark(#e7f3ef,#13261f);border-radius:12px;padding:14px;min-height:170px}
.bubble{background:light-dark(#fff,#1d2d27);border-radius:4px 12px 12px 12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.55;box-shadow:0 1px 0 var(--line);max-width:62ch}
.bubble .tm{display:block;text-align:right;font-size:11px;color:var(--mute);margin-top:6px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:420px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.col.over{background:light-dark(#d8ecea,#173634)}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px;font-weight:600}
.colh small{font-weight:400;color:var(--mute);font-size:12px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;text-align:left;width:100%;display:block;box-shadow:0 1px 2px #0000000d}
.kc:active{cursor:grabbing}
.kc.drag{opacity:.4}
.kc b{display:block;font-size:14px;font-weight:600}
.kc .d{font-size:13px;color:var(--mute);margin:2px 0 8px}
.kc .r{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:light-dark(#fff,#062022);font-size:11px;font-weight:600;flex:none}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap;font-weight:500}
.chip.High,.chip.Problem,.chip.risk{background:light-dark(#ffe7dc,#3a1d10);color:var(--acc)}
.chip.Won,.chip.Completed,.chip.Resolved{background:light-dark(#e0f2e8,#123222);color:var(--ok)}
.chip.Lost{background:light-dark(#fbe4e0,#3a1714);color:var(--bad)}
.chip.Scheduled,.chip.Pending{background:light-dark(#fdf1dc,#33260f);color:var(--warn)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:180px;max-width:360px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;min-height:38px;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line);padding:0}
th .sort{background:none;border:0;padding:10px 8px;width:100%;text-align:inherit;color:inherit;font-weight:500;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num .sort{text-align:right}
td select{min-height:36px;padding:5px 8px;font-size:14px}
.chk{width:22px;height:22px;accent-color:var(--brand);min-height:0}
.done td{color:var(--mute);text-decoration:line-through}
.done td:first-child{text-decoration:none}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.member{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px}
.member .h{display:flex;gap:10px;align-items:center}
.member .av{width:38px;height:38px;font-size:14px}
.member dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:14px}
.member dt{color:var(--mute)}.member dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.log .li{grid-template-columns:110px minmax(0,1fr)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.scrim{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}
.scrim.on{display:grid}
.modal{background:var(--panel);border-radius:14px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.form .full{grid-column:1/-1}
.form textarea{min-height:80px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mfoot .sp{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.drawerbg{display:none}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}
aside{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s}
.app.nav aside{transform:none}.app.nav .drawerbg{display:block;position:fixed;inset:0;background:#0006;z-index:25}
.burger{display:grid;place-items:center}}
@media(max-width:600px){.who span{display:none}.form{grid-template-columns:1fr}.bar{grid-template-columns:78px minmax(0,1fr) 78px}
table{font-size:13px}.stack{min-width:0}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent.replace(/[▲▼]/g,'').trim()||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="app" id="app">
<aside>
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#ffffff1f"/><rect x="7" y="8" width="5" height="18" rx="2" fill="#fff"/><rect x="14.5" y="8" width="5" height="12" rx="2" fill="#fff" opacity=".75"/><rect x="22" y="8" width="5" height="7" rx="2" fill="#ff7a3d"/></svg>
    <div><b>Autokan AI</b><small>by Bizwira Digital</small></div>
  </div>
  <nav id="nav"></nav>

<main>

  <header>
    <button class="burger" id="burger" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

</main>
</div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
{

const fmtKey=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const TODAY=fmtKey(new Date());
const addDays=(k,n)=>{const d=new Date(k+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};

  const prob=vis(S.deliveries).filter(d=>d.status==='Problem');
  const top=cs.slice().sort((a,b)=>['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority)||STAGES.indexOf(b.stage)-STAGES.indexOf(a.stage)||b.value-a.value).slice(0,3);
  const L=[`Selamat pagi, ${first(me.name)} 👋`,``,`*Pipeline:* ${cs.length} open cases worth ${rm(cs.reduce((a,c)=>a+c.value,0))}.`];
  if(late.length){L.push(`*Overdue (${late.length}):*`);late.slice(0,3).forEach(f=>{const c=kase(f.caseId);L.push(`• ${cust(c.cust).name}: ${f.note} (${diff(TODAY,f.due)}d late, ${first(user(f.rep).name)})`)})}
  if(today.length){L.push(`*Due today (${today.length}):*`);today.slice(0,3).forEach(f=>L.push(`• ${cust(kase(f.caseId).cust).name}: ${f.type.toLowerCase()}, ${f.note}`))}
  if(dv.length)L.push(`*Deliveries this week:* ${dv.length}${prob.length?`, and ${prob.length} flagged with a problem (${cust(prob[0].cust).name})`:''}.`);
  if(top.length){L.push(`*Top priorities:*`);top.forEach(c=>L.push(`• ${cust(c.cust).name}, ${c.title}: ${c.stage}, ${rm(c.value)}`))}
  const a=late[0]?`call ${cust(kase(late[0].caseId).cust).name} first, it's the oldest overdue item.`:top[0]?`move ${cust(top[0].cust).name} forward from ${top[0].stage}.`:'enjoy a quiet day.';
  L.push(``,`*Recommended first action:* ${a}`);
  return L.join('\n');
}
function typeBrief(){
  const text=briefing(),at=new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
  S.brief={text,at};save();
  const b=$('bubble');if(!b)return;
  const btn=document.querySelector('[data-act=brief]');if(btn)btn.textContent='Regenerate';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){b.innerHTML=esc(text)+`<span class="tm">${at} · WhatsApp</span>`;return}
  let i=0;clearInterval(typeBrief.t);
  typeBrief.t=setInterval(()=>{i+=4;const el=$('bubble');if(!el){clearInterval(typeBrief.t);return}
    el.innerHTML=esc(text.slice(0,i))+(i>=text.length?`<span class="tm">${at} · WhatsApp</span>`:'▍');if(i>=text.length)clearInterval(typeBrief.t)},16);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-case],[data-sort],[data-tab]');if(!t)return;
  if(t.dataset.sort){const [v,k]=t.dataset.sort.split(':');const s=sortSt[v];s.d=s.k===k?-s.d:1;s.k=k;render();return}
  if(t.dataset.tab){fuTab=t.dataset.tab;render();return}
  if(t.dataset.case&&!t.dataset.act){caseForm(t.dataset.case);return}
  const a=t.dataset.act;
  if(a==='close')close();
  if(a==='newcase')caseForm();
  if(a==='newfu')fuForm();
  if(a==='brief')typeBrief();
  if(a==='savecase'){const f=$('cf');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));d.value=+d.value;
    const id=t.dataset.id;
    if(id){const c=kase(id);const ch=Object.keys(d).filter(k=>String(c[k])!==String(d[k]));Object.assign(c,d);audit(`Updated <b>${esc(cust(c.cust).name)}</b> · ${esc(c.title)}${ch.length?` (${ch.join(', ')})`:''}`);toast('Case saved')}
    else{const c={id:uid('k'),created:TODAY,...d};S.cases.push(c);audit(`Created case <b>${esc(cust(c.cust).name)}</b> · ${esc(c.title)}, ${rm(c.value)}`);toast('Case created')}
    save();close();render()}
  if(a==='delcase'){const c=kase(t.dataset.id);S.cases=S.cases.filter(x=>x.id!==c.id);S.followups=S.followups.filter(f=>f.caseId!==c.id);audit(`Deleted case <b>${esc(cust(c.cust).name)}</b> · ${esc(c.title)}`);save();close();render();toast('Case deleted')}
  if(a==='savefu'){const f=$('ff');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));const c=kase(d.caseId);
    S.followups.push({id:uid('f'),rep:c.rep,done:false,...d});audit(`Added ${esc(d.type.toLowerCase())} follow-up for <b>${esc(cust(c.cust).name)}</b>, due ${fd(d.due)}`);save();close();render();toast('Follow-up added')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='me'){S.me=t.value;S.brief=null;save();render();toast(`Now viewing as ${esc(user(S.me).name)}`);return}
  if(t.dataset.done){const f=S.followups.find(x=>x.id===t.dataset.done);f.done=t.checked;audit(`${f.done?'Completed':'Reopened'} follow-up for <b>${esc(cust(kase(f.caseId)?.cust).name)}</b>: ${esc(f.note)}`);save();setTimeout(render,f.done?250:0);if(f.done)toast('Follow-up done')}
  if(t.dataset.dv){const d=S.deliveries.find(x=>x.id===t.dataset.dv);d.status=t.value;audit(`Delivery at <b>${esc(cust(d.cust).name)}</b> set to ${esc(d.status)}`);save();render();toast('Delivery updated')}
  if(t.dataset.tk){const k=S.tickets.find(x=>x.id===t.dataset.tk);k.status=t.value;audit(`Ticket for <b>${esc(cust(k.cust).name)}</b> set to ${esc(k.status)}`);save();render();toast('Ticket updated')}
});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.kc');if(!c)return;dragId=c.dataset.case;c.classList.add('drag');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.kc');if(c)c.classList.remove('drag');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();const c=kase(dragId);const st=col.dataset.stage;dragId=null;
  if(c&&c.stage!==st){const from=c.stage;c.stage=st;if(st==='Won'||st==='Lost')c.status='Closed';else if(c.status==='Closed')c.status='Open';
    audit(`Moved <b>${esc(cust(c.cust).name)}</b> · ${esc(c.title)} from ${from} to ${st}`);save();render();toast(st==='Won'?`🎉 Won ${rm(c.value)} with ${esc(cust(c.cust).name)}`:`Moved to ${st}`)}else render()});
$('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('burger').onclick=()=>$('app').classList.add('nav');
$('drawerbg').onclick=()=>$('app').classList.remove('nav');
$('reset').onclick=()=>{S=seed();save();fuTab='open';q={};route();toast('Demo data reset')};
window.addEventListener('hashchange',route);
route();
}
</script>
